{% extends "base.html" %}
{% block title %}Đăng ký cửa hàng – SaveShelf{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;margin:20px auto">
  <h2 style="margin-top:0">Đăng ký cửa hàng</h2>
  <form method="post">
    <label for="name">Tên cửa hàng</label><input id="name" name="name" required>
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="password">Mật khẩu (tối thiểu 6 ký tự)</label><input id="password" name="password" type="password" minlength="6" required>
    <label for="address">Địa chỉ</label><input id="address" name="address" required>
    <label for="phone">Số điện thoại</label><input id="phone" name="phone" inputmode="tel">
    <label>Vị trí cửa hàng (bấm lên bản đồ để đặt ghim)</label>
    <div id="map" style="height:280px;border-radius:12px;border:1px solid var(--bd)"></div>
    <input type="hidden" name="lat" id="lat"><input type="hidden" name="lng" id="lng">
    <p><button type="button" class="btn sec sm" id="btn-here">📍 Dùng vị trí hiện tại</button></p>
    <p><button class="btn" style="width:100%">Tạo tài khoản</button></p>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
const map = L.map("map").setView([10.7769, 106.7009], 14);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
let pin = null;
function setPin(lat, lng){
  document.getElementById("lat").value = lat; document.getElementById("lng").value = lng;
  if (pin) pin.setLatLng([lat, lng]); else pin = L.marker([lat, lng]).addTo(map);
}
map.on("click", e => setPin(e.latlng.lat, e.latlng.lng));
document.getElementById("btn-here").onclick = () => navigator.geolocation && navigator.geolocation.getCurrentPosition(
  p => { setPin(p.coords.latitude, p.coords.longitude); map.setView([p.coords.latitude, p.coords.longitude], 16); },
  () => alert("Không lấy được vị trí. Hãy bấm lên bản đồ."));
</script>
{% endblock %}
